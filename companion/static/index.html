<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookmark</title>
<style nonce="__NONCE__">
:root {
  color-scheme: light dark;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* light theme: parchment and bronze */
  --bg: #f4eee1; --panel: #fffaf0; --raised: #fbf4e6; --soft: #efe5d0; --line: #d9cbb0; --input: #fffdf7;
  --ink: #2b2318; --muted: #6a5d48; --accent: #8b5a12; --accent-ink: #fffaf0; --glow: rgba(139, 90, 18, .10);
  --ok: #2e6b3d; --warn: #8a5a00; --bad: #9a3326;
  --radius: 14px; --shadow: 0 1px 2px rgba(60, 40, 10, .06), 0 14px 30px -18px rgba(60, 40, 10, .30);
}
@media (prefers-color-scheme: dark) {
  :root {
    /* dark theme: warm ink and gold, not cold grey-blue */
    --bg: #14110e; --panel: #1d1915; --raised: #26211b; --soft: #2c251d; --line: #3b3329; --input: #16130f;
    --ink: #f2ebdd; --muted: #b8ac95; --accent: #d9ad62; --accent-ink: #1a1409; --glow: rgba(217, 173, 98, .12);
    --ok: #9fcfa6; --warn: #e6b865; --bad: #eba295;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 18px 40px -22px rgba(0, 0, 0, .85);
  }
}
* { box-sizing: border-box; }
html { font-size: 16px; scrollbar-color: var(--line) transparent; }
body { margin: 0; color: var(--ink); line-height: 1.55; font-family: var(--sans);
  background: radial-gradient(900px 420px at 50% -90px, var(--glow), transparent 70%) no-repeat, var(--bg); min-height: 100vh; }
::selection { background: var(--glow); color: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
input[type=checkbox] { accent-color: var(--accent); }

header.top { position: relative; padding: 42px 24px 8px; text-align: center; }
header.top::after { content: ""; display: block; width: min(420px, 60%); height: 1px; margin: 26px auto 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .55; }
.brand .mark { color: var(--accent); }
.brand h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(2.1rem, 4.6vw, 3.1rem); letter-spacing: .03em;
  margin: 8px 0 6px; line-height: 1.1; }
.tagline { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 1.12rem; margin: 0 auto; max-width: 560px; }
.tools { position: absolute; top: 14px; right: 118px; display: flex; align-items: center; gap: 10px; }
@media (max-width: 700px) { header.top { padding-top: 18px; } .tools { position: static; justify-content: center; margin-bottom: 20px; } }

.layout { display: grid; grid-template-columns: 300px 1fr; gap: 24px; padding: 28px 24px 56px; max-width: 1120px; margin: 0 auto; }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; padding: 16px 14px 40px; } aside { order: 2; }
  body.choosing aside { order: 0; } /* nothing chosen yet: the library and the add form come first */ }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.card + .card { margin-top: 18px; }
h2 { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; font-weight: 700; }
label { display: block; font-size: .9rem; color: var(--muted); margin: 12px 0 5px; }
input[type=text], input[type=password], input[type=file], select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--input); }
input[type=file]::file-selector-button { margin-right: 12px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--raised); color: var(--ink); cursor: pointer; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
textarea { min-height: 96px; resize: vertical; font-family: var(--serif); font-size: 1.04rem; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

button { cursor: pointer; border: 1px solid var(--line); background: var(--raised); color: var(--ink); border-radius: 10px;
  padding: 9px 16px; min-height: 40px; }
button:not(.pick, .link, .chip, .cite):hover:not(:disabled) { border-color: var(--accent); background: var(--soft); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; min-height: 0; text-decoration: underline; }
button:disabled { opacity: .55; cursor: not-allowed; }
@media (prefers-reduced-motion: no-preference) {
  button, input, select, textarea, .chip, .passage { transition: background-color .15s, border-color .15s, filter .15s, outline-color .3s; }
}

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 160px; }
.muted { color: var(--muted); font-size: .9rem; }
.books { list-style: none; margin: 0; padding: 0; }
.books li { display: flex; align-items: center; gap: 6px; border-radius: 10px; }
.books li.active { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
.books .pick { flex: 1; text-align: left; border: 0; background: none; padding: 11px 12px; border-radius: 10px; font-family: var(--serif);
  font-size: 1.05rem; }
.books .pick:hover { background: var(--soft); }
.books .pick small { display: block; color: var(--muted); font-family: var(--sans); font-size: .8rem; }
.badge { display: inline-block; font-size: .75rem; padding: 3px 10px; border-radius: 999px; background: var(--raised);
  border: 1px solid var(--line); color: var(--ink); }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }
.pos { margin-top: 14px; padding: 11px 14px; border-radius: 10px; background: var(--soft); border-left: 3px solid var(--accent); }

.empty { text-align: center; padding: 60px 24px 52px; }
.empty h2 { font-family: var(--serif); text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 600;
  font-size: clamp(1.45rem, 3vw, 1.95rem); line-height: 1.25; margin: 0 auto 12px; max-width: 620px; }
.empty > p { max-width: 520px; margin: 0 auto; font-size: 1rem; }
.empty ol { list-style: none; counter-reset: step; text-align: left; display: inline-block; margin: 30px 0 0; padding: 0; }
.empty li { counter-increment: step; position: relative; padding: 4px 0 0 46px; margin: 14px 0; min-height: 30px; line-height: 1.45; }
.empty li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; border: 1px solid var(--accent); color: var(--accent); background: var(--soft);
  font-weight: 650; font-size: .88rem; line-height: 1; }

.answer { border-left: 4px solid var(--accent); }
.answer .text { white-space: pre-wrap; margin: 10px 0; font-family: var(--serif); font-size: 1.1rem; line-height: 1.7; }
.answer.refused { border-left-color: var(--warn); }
.cite { border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 0 6px; min-height: 0; font-size: .85rem;
  color: var(--accent); }
.cite:hover { border-color: var(--accent); }
details.sources { margin-top: 12px; }
details.sources summary { cursor: pointer; color: var(--muted); }
.passage { margin: 8px 0; padding: 10px 12px; border-radius: 10px; background: var(--input); border: 1px solid var(--line);
  font-size: .94rem; }
.passage.flash { outline: 2px solid var(--accent); }
.passage .meta { color: var(--muted); font-size: .8rem; margin-bottom: 2px; }
.progress { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress > span { display: block; height: 100%; background: var(--accent); width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip { border-radius: 999px; padding: 4px 14px; min-height: 36px; background: var(--raised); border: 1px solid var(--line); }
.chip:hover { border-color: var(--accent); }
.chip small { color: var(--muted); }
.chip.other { background: transparent; }
.chip.active { outline: 2px solid var(--accent); }
details.people > summary { cursor: pointer; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
.cardbox { margin-top: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--input); }
.cardbox h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }
.cardbox .row2 { margin: 8px 0; }
.cardbox blockquote { margin: 4px 0 4px 8px; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--muted);
  font-family: var(--serif); font-size: 1.02rem; }
.guide { max-width: 1120px; margin: 6px auto 0; padding: 0 24px; }
.guide-card { background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px 24px 22px; text-align: center; }
.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0; margin: 0 0 16px; }
.steps li { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 5px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); font-size: .9rem; }
.steps .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--soft);
  font-weight: 700; font-size: .8rem; }
.steps li.current { color: var(--ink); border-color: var(--accent); }
.steps li.current .n { background: var(--accent); color: var(--accent-ink); }
.steps li.done .n { background: var(--ok); color: var(--panel); }
.guide-title { font-family: var(--serif); font-size: clamp(1.25rem, 2.6vw, 1.6rem); font-weight: 600; margin: 0 0 8px; }
.guide-text { margin: 0 auto; max-width: 720px; font-size: 1.04rem; }
.card.focus { outline: 2px solid var(--accent); outline-offset: 0; box-shadow: 0 0 0 7px var(--glow), var(--shadow); }
@media (prefers-reduced-motion: no-preference) {
  .card.focus { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 12px var(--glow), var(--shadow); } }
}
@media (max-width: 820px) { .guide { padding: 0 14px; } .guide-card { padding: 16px 16px 18px; } }
.note { margin: 0 0 14px; padding: 10px 14px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--soft); font-size: .95rem; }
.lang { position: fixed; top: 12px; right: 12px; z-index: 30; display: flex; padding: 3px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
.lang button { min-height: 32px; padding: 3px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--muted);
  font-weight: 700; font-size: .82rem; letter-spacing: .06em; }
.lang button:hover:not(:disabled) { background: var(--soft); border: 0; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button[aria-pressed="true"]:hover:not(:disabled) { background: var(--accent); }
details.adv { margin: 8px 0 4px; }
details.adv > summary { cursor: pointer; color: var(--muted); font-size: .92rem; }
.howto-title { font-weight: 650; margin: 14px 0 4px; }
.howto { margin: 0 0 12px; padding-left: 22px; }
.howto li { margin: 5px 0; }
input[type=file] { font-size: .85rem; }
button.primary { min-height: 44px; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); max-width: 540px;
  width: calc(100% - 32px); padding: 24px; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 8, 5, .62); }
.err { color: var(--bad); }
.sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Idioma / Language">
  <button type="button" data-lang="es" title="Español" aria-pressed="false">ES</button>
  <button type="button" data-lang="en" title="English" aria-pressed="false">EN</button>
</div>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 2h12a1.5 1.5 0 0 1 1.5 1.5V22l-7.5-4.8L4.5 22V3.5A1.5 1.5 0 0 1 6 2z"/></svg>
    <h1 data-i18n="title"></h1>
    <p class="tagline" data-i18n="tagline"></p>
  </div>
  <div class="tools">
    <span id="llmBadge" class="badge" role="status"></span>
    <button id="openHelp" data-i18n="openHelp"></button>
    <button id="openSettings" data-i18n="settings"></button>
  </div>
</header>

<section id="guide" class="guide" role="status" aria-live="polite">
  <div class="guide-card">
    <ol id="steps" class="steps">
      <li><span class="n">1</span><span data-i18n="stepBook"></span></li>
      <li><span class="n">2</span><span data-i18n="stepPlace"></span></li>
      <li><span class="n">3</span><span data-i18n="stepAsk"></span></li>
    </ol>
    <p id="guideTitle" class="guide-title"></p>
    <p id="guideText" class="guide-text"></p>
  </div>
</section>

<main class="layout">
  <aside>
    <section id="libCard" class="card" aria-labelledby="libTitle">
      <h2 id="libTitle" data-i18n="library"></h2>
      <ul id="books" class="books"></ul>
      <p id="noBooks" class="muted" data-i18n="noBooks"></p>
    </section>
    <section id="addCard" class="card" aria-labelledby="addTitle">
      <h2 id="addTitle" data-i18n="addBook"></h2>
      <form id="addForm">
        <label for="file" data-i18n="file"></label>
        <input id="file" type="file" accept=".epub,.txt,.srt,.vtt" multiple required>
        <label for="bookTitle" data-i18n="bookTitle"></label>
        <input id="bookTitle" type="text" maxlength="200">
        <label for="bookLang" data-i18n="language"></label>
        <select id="bookLang">
          <option value="" data-i18n="auto"></option>
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
        <label class="row"><input id="embed" type="checkbox"> <span data-i18n="embed"></span></label>
        <p id="embedHelp" class="muted"></p>
        <button class="primary" type="submit" data-i18n="add"></button>
        <p id="addStatus" class="muted" role="status"></p>
        <div id="jobBar" class="progress" hidden><span></span></div>
      </form>
    </section>
  </aside>

  <section id="content">
    <div id="empty" class="card empty">
      <h2 data-i18n="welcomeTitle"></h2>
      <p class="muted" data-i18n="welcome"></p>
      <ol><li data-i18n="step1"></li><li data-i18n="step2"></li><li data-i18n="step3"></li></ol>
    </div>

    <div id="bookView" hidden>
      <section id="posCard" class="card" aria-labelledby="posTitle">
        <h2 id="posTitle" data-i18n="where"></h2>
        <h3 id="bookName" class="sr"></h3>
        <label for="chapter" id="finishedLabel" data-i18n="finishedChapter"></label>
        <select id="chapter"></select>
        <div id="timeRow" hidden>
          <label for="episodeAt" data-i18n="atEpisode"></label>
          <div class="row">
            <select id="episodeAt" class="grow"></select>
            <input id="clock" type="text" inputmode="numeric" size="8" data-i18n-ph="clockPh" aria-label="mm:ss">
            <button id="setTime" type="button" data-i18n="setTime"></button>
          </div>
        </div>
        <label for="phrase" data-i18n="orPhrase"></label>
        <div class="row">
          <input id="phrase" class="grow" type="text" data-i18n-ph="phrasePh">
          <button id="locate" type="button" data-i18n="locate"></button>
        </div>
        <p id="locateMsg" class="muted" role="status"></p>
        <div id="pos" class="pos"></div>
      </section>

      <section class="card" aria-labelledby="peopleTitle">
        <details id="people" class="people">
          <summary id="peopleTitle" data-i18n="peopleTitle"></summary>
          <p class="muted" data-i18n="peopleHint"></p>
          <div id="chips" class="chips" role="list"></div>
          <p id="peopleMsg" class="muted" role="status"></p>
          <div id="cardBox" class="cardbox" hidden></div>
        </details>
      </section>

      <section id="askCard" class="card" aria-labelledby="askTitle">
        <h2 id="askTitle" data-i18n="ask"></h2>
        <p id="llmNote" class="note" hidden><span data-i18n="llmNoteText"></span> <button id="openAi" type="button" class="link" data-i18n="openAiSettings"></button></p>
        <div id="examplesBox" hidden>
          <p class="muted" data-i18n="tryExample"></p>
          <div id="examples" class="chips"></div>
        </div>
        <label for="question" class="sr" data-i18n="question"></label>
        <textarea id="question" data-i18n-ph="questionPh"></textarea>
        <div class="row">
          <button id="askBtn" class="primary" type="button" data-i18n="askBtn"></button>
          <button id="recapBtn" type="button" data-i18n="recapBtn"></button>
          <label class="row" id="agentWrap"><input id="agent" type="checkbox"> <span data-i18n="agent"></span></label>
        </div>
        <p id="askMsg" class="muted" role="status"></p>
      </section>

      <div id="answers" aria-live="polite"></div>
    </div>
  </section>
</main>

<dialog id="helpDialog" aria-labelledby="helpHeading">
  <h2 id="helpHeading" data-i18n="helpTitle"></h2>
  <p data-i18n="helpP1"></p>
  <p data-i18n="helpP2"></p>
  <p data-i18n="helpP3"></p>
  <p data-i18n="helpP4"></p>
  <div class="row"><button id="closeHelp" class="primary" type="button" data-i18n="close"></button></div>
</dialog>

<dialog id="settings" aria-labelledby="setTitle">
  <form method="dialog" id="setForm">
    <h2 id="setTitle" data-i18n="llmSettings"></h2>
    <p class="muted" data-i18n="llmIntro"></p>
    <p class="howto-title" data-i18n="howtoTitle"></p>
    <ol class="howto"><li data-i18n="howto1"></li><li data-i18n="howto2"></li><li data-i18n="howto3"></li></ol>
    <p id="current" class="muted"></p>
    <label for="provider" data-i18n="provider"></label>
    <select id="provider">
      <option value="gemini">Google Gemini</option>
      <option value="anthropic">Anthropic</option>
      <option value="custom">Ollama / otro compatible</option>
    </select>
    <label for="apiKey" data-i18n="apiKey"></label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
    <p class="muted" id="keyHelp"></p>
    <details class="adv">
      <summary data-i18n="advanced"></summary>
      <label for="baseUrl" data-i18n="baseUrl"></label>
      <input id="baseUrl" type="text" placeholder="http://localhost:11434/v1" autocomplete="off">
      <label for="model" data-i18n="model"></label>
      <div class="row">
        <input id="model" class="grow" type="text" list="modelList" autocomplete="off">
        <datalist id="modelList"></datalist>
        <button id="listModels" type="button" data-i18n="listModels"></button>
      </div>
    </details>
    <p id="setMsg" class="muted" role="status"></p>
    <div class="row">
      <button class="primary" id="saveKey" type="button" data-i18n="save"></button>
      <button id="clearKey" type="button" data-i18n="remove"></button>
      <button id="closeSettings" type="button" data-i18n="close"></button>
    </div>
    <p class="muted" data-i18n="storageNote"></p>
  </form>
</dialog>

<script nonce="__NONCE__">
"use strict";
const TOKEN = "__TOKEN__";
const savedLanguage = localStorage.getItem("lang");
let LANG = savedLanguage === "es" || savedLanguage === "en" ? savedLanguage
  : ((navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en");
const TEXT = {
  es: {
    title: "Marcapáginas", tagline: "Tu compañero de lectura: pregunta sin que te cuenten lo que viene.", settings: "Ajustes de IA", library: "Mi biblioteca",
    noBooks: "Aún no has añadido ningún libro.", addBook: "Añadir un libro", file: "Elige tu libro (EPUB o texto) o los subtítulos de tu serie (.srt)",
    bookTitle: "Título (opcional)", embed: "Búsqueda por significado (más lenta)", add: "Añadir a mi biblioteca",
    embedOn: "Se calcula una sola vez; una novela tarda unos minutos.",
    embedOff: "No disponible: instala fastembed (pip install fastembed).",
    welcomeTitle: "Pregunta sobre lo que has leído, sin que te destripen lo que viene",
    welcome: "Todo se procesa en tu equipo. Solo se usa texto anterior a tu posición.",
    step1: "Añade un libro que tengas (EPUB o texto).", step2: "Indica hasta dónde has leído.", step3: "Pregunta o pide un resumen.",
    where: "¿Dónde vas?", finishedChapter: "He terminado el capítulo…", orPhrase: "…o pega una frase que recuerdes",
    phrasePh: "Una frase del último pasaje que leíste", locate: "Localizar", question: "Pregunta",
    questionPh: "Por ejemplo: ¿Quién es ese personaje y qué quiere?", ask: "Pregunta", askBtn: "Preguntar",
    recapBtn: "Resumen de dónde voy", agent: "Modo agente (la IA busca por su cuenta)",
    notStarted: "Aún no he empezado", finished: "Terminado: ", position: "Posición", at: "Capítulo ",
    located: "Te he situado en el capítulo", confirmLocate: "¿Es aquí? Si no, prueba con una frase más larga.",
    noMatch: "No encuentro esa frase; prueba con otra más larga o exacta.",
    refusedMode: "No respondida: depende de lo que viene después", llmMode: "Respuesta de IA", passagesMode: "Fragmentos (sin IA configurada)",
    agentMode: "Respuesta de IA con herramientas", sources: "Pasajes usados", tools: "Búsquedas del agente", thinking: "Pensando…",

const t = (key) => TEXT[LANG][key] ?? key;
const $ = (id) => document.getElementById(id);

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: { "X-Token": TOKEN, ...(options.headers || {}) } });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

let state = { books: [], embeddings_available: false, llm: {} };
let current = null;      // title of the selected book
let chapters = [];       // [{number, title}] of the selected book

function applyText() {
  document.documentElement.lang = LANG;
  document.title = t("title") + " · " + t("tagline");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
}

// ---- position, remembered per book in this browser ------------------------------------------------------------
const posKey = (title) => "pos:" + title;
const getPos = (title) => { try { return JSON.parse(localStorage.getItem(posKey(title))) || { chapter: 0 }; } catch { return { chapter: 0 }; } };
const setPos = (title, pos) => localStorage.setItem(posKey(title), JSON.stringify(pos));

function positionBody() {
  const pos = getPos(current);
  if (pos.episode != null) return { title: current, episode: pos.episode, time: pos.time };
  return pos.ordinal != null ? { title: current, ordinal: pos.ordinal } : { title: current, chapter: pos.chapter || 0 };
}
function describePosition() {
  const pos = getPos(current);
  const box = $("pos");
  box.textContent = "";
  const strong = document.createElement("strong");
  strong.textContent = t("position") + ": ";
  box.append(strong);
  if (pos.ordinal != null || pos.episode != null) box.append(pos.label || "");
  else if (!pos.chapter) box.append(t("notStarted"));
  else {
    const c = chapters.find((x) => x.number === pos.chapter);
    box.append(t("finished") + pos.chapter + (c ? ". " + c.title : ""));
  }
  updateGuide();
  loadExamples();
  if ($("people").open) refreshPeople();
}

// ---- library ----------------------------------------------------------------------------------------------------
function renderBooks() {
  const list = $("books");
  list.textContent = "";
  $("noBooks").hidden = state.books.length > 0;
  for (const book of state.books) {
    const item = document.createElement("li");
    if (book.title === current) item.className = "active";
    const pick = document.createElement("button");
    pick.className = "pick";
    pick.type = "button";
    pick.textContent = book.title;
    const small = document.createElement("small");
    small.textContent = book.chapters + t(book.kind === "video" ? "episodes" : "chapters") + (book.lang ? " · " + book.lang.toUpperCase() : "") + (book.semantic ? " · " + t("semantic") : "");
    pick.append(small);
    pick.addEventListener("click", () => selectBook(book.title));
    const del = document.createElement("button");
    del.type = "button";
    del.className = "link";
    del.textContent = t("del");
    del.setAttribute("aria-label", t("del") + ": " + book.title);
    del.addEventListener("click", async () => {
      if (!confirm(t("confirmDel"))) return;
      await post("/api/delete", { title: book.title });
      if (current === book.title) current = null;
      await refresh();
    });
    item.append(pick, del);
    list.append(item);
  }
}

function renderLlm() {
  const badge = $("llmBadge");
  const ok = state.llm && state.llm.configured;
  badge.textContent = ok ? t("llmOk") : t("llmNone");
  badge.className = "badge " + (ok ? "ok" : "warn");
  $("agentWrap").hidden = !ok;
  $("llmNote").hidden = ok;
  $("embed").disabled = !state.embeddings_available;
  $("embedHelp").textContent = state.embeddings_available ? t("embedOn") : t("embedOff");
}

async function refresh() {
  state = await api("/api/state");
  renderBooks();
  renderLlm();
  const present = state.books.some((b) => b.title === current);
  if (!present) current = null;
  $("empty").hidden = current != null;
  $("bookView").hidden = current == null;
  if (current) await loadChapters();
  updateGuide();
}

async function loadChapters() {
  chapters = await api("/api/chapters?title=" + encodeURIComponent(current));
  const select = $("chapter");
  select.textContent = "";
  const first = document.createElement("option");
  first.value = "0";
  first.textContent = t("notStarted");
  select.append(first);
  for (const c of chapters) {
    const option = document.createElement("option");
    option.value = String(c.number);
    option.textContent = c.number + ". " + c.title;
    select.append(option);
  }
  const video = (state.books.find((b) => b.title === current) || {}).kind === "video";
  $("finishedLabel").textContent = t(video ? "finishedEpisode" : "finishedChapter");
  $("timeRow").hidden = !video;
  const episodeAt = $("episodeAt");
  episodeAt.textContent = "";
  for (const c of chapters) {
    const option = document.createElement("option");
    option.value = String(c.number);
    option.textContent = c.number + ". " + c.title;
    episodeAt.append(option);
  }
  const pos = getPos(current);
  select.value = pos.ordinal != null || pos.episode != null ? "0" : String(pos.chapter || 0);
  if (pos.episode != null) { episodeAt.value = String(pos.episode); $("clock").value = pos.time || ""; }
  describePosition();
}

async function selectBook(title) {
  current = title;
  $("answers").textContent = "";
  $("locateMsg").textContent = "";
  $("bookName").textContent = title;
  $("empty").hidden = true;
  $("bookView").hidden = false;
  renderBooks();
  await loadChapters();
}

$("setTime").addEventListener("click", () => {
  const time = $("clock").value.trim();
  if (!/^(\d+:)?\d{1,2}:\d{2}$|^\d+$/.test(time)) { $("locateMsg").textContent = t("badClock"); return; }
  const episode = Number($("episodeAt").value);
  setPos(current, { episode, time, label: t("episodeWord") + episode + " · " + time });
  $("chapter").value = "0";
  $("locateMsg").textContent = "";
  describePosition();
});

$("chapter").addEventListener("change", () => {
  setPos(current, { chapter: Number($("chapter").value) });
  $("locateMsg").textContent = "";
  describePosition();
});

$("locate").addEventListener("click", async () => {
  const phrase = $("phrase").value.trim();
  if (!phrase) return;
  $("locateMsg").textContent = t("thinking");
  try {
    const found = await post("/api/locate", { title: current, phrase });
    const label = t("at") + found.chapter + ". " + found.chapter_title;
    setPos(current, { ordinal: found.ordinal, chapter: found.chapter, label });
    $("chapter").value = "0";
    $("locateMsg").textContent = t("located") + " " + found.chapter + ": «" + found.excerpt.slice(0, 140) + "…» " + t("confirmLocate");
    describePosition();
  } catch (error) {
    $("locateMsg").textContent = error.message.includes("No close match") ? t("noMatch") : t("error") + error.message;
  }
});

// ---- adding books -----------------------------------------------------------------------------------------------
function decodeText(buffer) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buffer); }
  catch { return new TextDecoder("windows-1252").decode(buffer); }  // older subtitle files
}

$("addForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const files = [...$("file").files];
  if (!files.length) return;
  $("addStatus").textContent = t("adding");
  try {
    const subtitles = files.every((f) => /[.](srt|vtt)$/i.test(f.name));
    let result;
    if (subtitles) {
      const episodes = [];
      for (const file of files) episodes.push({ name: file.name, text: decodeText(await file.arrayBuffer()) });
      result = await post("/api/ingest-subs", { title: $("bookTitle").value.trim(), episodes, embed: $("embed").checked, lang: $("bookLang").value });
    } else {
      if (files.length > 1) throw new Error(t("videoNote"));
      const file = files[0];
      const query = new URLSearchParams({ filename: file.name, title: $("bookTitle").value.trim(), embed: $("embed").checked ? "1" : "0", lang: $("bookLang").value });
      result = await api("/api/ingest?" + query, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: file });
    }
    $("addStatus").textContent = t("added") + result.title;
    $("addForm").reset();
    await refresh();
    await selectBook(result.title);
    if (result.job) watchJob(result.job);
  } catch (error) {
    $("addStatus").textContent = t("error") + error.message;
  }
});

function watchJob(id) {
  const bar = $("jobBar");
  bar.hidden = false;
  const timer = setInterval(async () => {
    try {
      const job = await api("/api/jobs/" + id);
      const share = job.total ? job.done / job.total : 0;
      bar.firstElementChild.style.width = Math.round(share * 100) + "%";
      $("addStatus").textContent = t("embedding") + (job.total ? job.done + "/" + job.total : "");
      if (job.state !== "running") {
        clearInterval(timer);
        bar.hidden = true;
        $("addStatus").textContent = job.state === "error" ? t("error") + job.error : "";
        await refresh();
      }
    } catch (error) {
      clearInterval(timer);
      $("addStatus").textContent = t("error") + error.message;
    }
  }, 1500);
}

// ---- asking -----------------------------------------------------------------------------------------------------
function renderAnswerText(container, text) {
  const pieces = text.split(/(\[\d+(?:\s*,\s*\d+)*\])/);
  for (const piece of pieces) {
    const match = /^\[(\d+(?:\s*,\s*\d+)*)\]$/.exec(piece);
    if (!match) { container.append(document.createTextNode(piece)); continue; }
    for (const number of match[1].split(/\s*,\s*/)) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "cite";
      button.textContent = "[" + number + "]";
      button.addEventListener("click", () => {
        const card = container.closest(".answer");
        const target = card.querySelector('[data-ordinal="' + number + '"]');
        if (!target) return;
        card.querySelector("details.sources").open = true;
        target.classList.add("flash");
        target.scrollIntoView({ block: "nearest" });
        setTimeout(() => target.classList.remove("flash"), 1600);
      });
      container.append(button);
    }
  }
}

function showAnswer(question, data) {
  const card = document.createElement("article");
  card.className = "card answer" + (data.mode === "passages" && !data.passages.length ? " refused" : "");
  const head = document.createElement("div");
  head.className = "row";
  const badge = document.createElement("span");
  const refused = Boolean(data.refused);
  badge.className = "badge " + (refused ? "warn" : data.mode === "passages" ? "warn" : "ok");
  badge.textContent = refused ? t("refusedMode") : data.mode === "agent" ? t("agentMode") : data.mode === "llm" ? t("llmMode") : t("passagesMode");
  const q = document.createElement("strong");
  q.textContent = question;
  head.append(badge, q);
  const body = document.createElement("div");
  body.className = "text";
  renderAnswerText(body, data.answer);
  card.append(head, body);
  if (data.tools && data.tools.length) {
    const tools = document.createElement("p");
    tools.className = "muted";
    tools.textContent = t("tools") + ": " + data.tools.join(" · ");
    card.append(tools);
  }
  if (data.passages && data.passages.length) {
    const details = document.createElement("details");
    details.className = "sources";
    const summary = document.createElement("summary");
    summary.textContent = t("sources") + " (" + data.passages.length + ")";
    details.append(summary);
    for (const p of data.passages) {
      const item = document.createElement("div");
      item.className = "passage";
      item.dataset.ordinal = String(p.ordinal);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "[" + p.ordinal + "] " + t(p.start != null ? "episodeWord" : "at") + p.chapter + " · " + p.chapter_title + (p.start != null ? " · " + clock(p.start) : "");
      const text = document.createElement("div");
      text.textContent = p.text;
      item.append(meta, text);
      details.append(item);
    }
    card.append(details);
  }
  $("answers").prepend(card);
  updateGuide();
}

async function run(kind) {
  const question = $("question").value.trim();
  if (kind === "ask" && !question) { $("askMsg").textContent = t("askFirst"); return; }
  $("askMsg").textContent = t("thinking");
  $("askBtn").disabled = $("recapBtn").disabled = true;
  try {
    const body = { ...positionBody(), question, agent: $("agent").checked && !$("agentWrap").hidden };
    const data = await post(kind === "ask" ? "/api/ask" : "/api/recap", body);
    showAnswer(kind === "ask" ? question : t("recapBtn"), data);
    $("askMsg").textContent = "";
  } catch (error) {
    $("askMsg").textContent = t("error") + error.message;
  } finally {
    $("askBtn").disabled = $("recapBtn").disabled = false;
  }
}
$("askBtn").addEventListener("click", () => run("ask"));
$("recapBtn").addEventListener("click", () => run("recap"));
$("question").addEventListener("keydown", (event) => { if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) run("ask"); });

// ---- characters -------------------------------------------------------------------------------------------------
let activeName = null;
let showAllPeople = false;
const PEOPLE_SHOWN = 12;

// ---- step-by-step guide -----------------------------------------------------------------------------------------
function hasPosition() {
  const pos = getPos(current);
  return pos.ordinal != null || pos.episode != null || (pos.chapter || 0) > 0;
}

let lastGuide = null;

function updateGuide() {
  const books = state.books || [];
  const video = current && (books.find((b) => b.title === current) || {}).kind === "video";
  let step, key, target;
  if (!books.length) { step = 1; key = "g1"; target = "addCard"; }
  else if (!current) { step = 1; key = "g1b"; target = "libCard"; }
  else if (!hasPosition()) { step = 2; key = video ? "g2v" : "g2"; target = "posCard"; }
  else if (!$("answers").children.length) { step = 3; key = "g3"; target = "askCard"; }
  else { step = 4; key = "g4"; target = null; }
  document.body.classList.toggle("choosing", !current);
  $("guideTitle").textContent = t(key + "Title");
  $("guideText").textContent = t(key + "Text");
  [...$("steps").children].forEach((item, index) => {
    const number = index + 1;
    item.className = number < step ? "done" : number === step ? "current" : "";
    item.querySelector(".n").textContent = number < step ? "✓" : String(number);
  });
  for (const id of ["addCard", "libCard", "posCard", "askCard"]) $(id).classList.toggle("focus", id === target);
  // When the next step changes, bring its box into view so nobody has to hunt for it (not on first load).
  if (target && lastGuide !== null && lastGuide !== key && !$(target).hidden) {
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    $(target).scrollIntoView({ block: "center", behavior: calm ? "auto" : "smooth" });
  }
  lastGuide = key;
}

async function loadExamples() {
  const box = $("examples");
  if (!current || !hasPosition()) { $("examplesBox").hidden = true; return; }
  let people = [];
  try { people = (await post("/api/characters", positionBody())).filter((p) => p.kind === "character").slice(0, 3); } catch { people = []; }
  box.textContent = "";
  const recap = document.createElement("button");
  recap.type = "button";
  recap.className = "chip other";
  recap.textContent = t("exRecap");
  recap.addEventListener("click", () => run("recap"));
  box.append(recap);
  for (const person of people) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip other";
    chip.textContent = t("whoIs") + person.name + "?";
    chip.addEventListener("click", () => { $("question").value = t("whoIs") + person.name + "?"; run("ask"); });
    box.append(chip);
  }
  $("examplesBox").hidden = false;
}

async function refreshPeople() {
  if (!current) return;
  const chips = $("chips");
  $("peopleMsg").textContent = t("thinking");
  try {
    const people = await post("/api/characters", positionBody());
    chips.textContent = "";
    $("peopleMsg").textContent = people.length ? "" : t("noPeople");
    for (const person of (showAllPeople ? people : people.slice(0, PEOPLE_SHOWN))) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip " + (person.kind === "character" ? "" : "other") + (person.name === activeName ? " active" : "");
      chip.setAttribute("role", "listitem");
      chip.append(person.name + " ");
      const count = document.createElement("small");
      count.textContent = String(person.mentions);
      chip.append(count);
      chip.addEventListener("click", () => showCard(person.name));
      chips.append(chip);
    }
    if (people.length > PEOPLE_SHOWN) {
      const more = document.createElement("button");
      more.type = "button";
      more.className = "link";
      more.textContent = showAllPeople ? t("showFewer") : t("showAll") + people.length;
      more.addEventListener("click", () => { showAllPeople = !showAllPeople; refreshPeople(); });
      chips.append(more);
    }
    if (activeName) await showCard(activeName, true);
  } catch (error) {
    $("peopleMsg").textContent = t("error") + error.message;
  }
}

function clock(seconds) {
  const total = Math.floor(seconds), h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  const two = (n) => String(n).padStart(2, "0");
  return h ? h + ":" + two(m) + ":" + two(s) : m + ":" + two(s);
}

function line(parent, label, text, ordinal, start) {
  const row = document.createElement("div");
  row.className = "row2";
  const strong = document.createElement("strong");
  strong.textContent = label + (ordinal != null ? " [" + ordinal + "]" : "") + (start != null ? " (" + clock(start) + ")" : "") + ": ";
  row.append(strong);
  const quote = document.createElement("blockquote");
  quote.textContent = text;
  row.append(quote);
  parent.append(row);
}

async function showCard(name, quiet = false) {
  const box = $("cardBox");
  try {
    const card = await post("/api/card", { ...positionBody(), name });
    activeName = card.name;
    box.hidden = false;
    box.textContent = "";
    const title = document.createElement("h3");
    title.textContent = card.name + (card.aliases.length ? " (" + t("alsoCalled") + card.aliases.join(", ") + ")" : "");
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = t(card.kind === "character" ? "kindCharacter" : "kindOther");
    const stats = document.createElement("p");
    stats.className = "muted";
    const span = card.chapters.length > 1 ? card.chapters[0] + "–" + card.chapters[card.chapters.length - 1] : String(card.chapters[0]);
    stats.textContent = card.mentions + " " + t("mentionsLabel") + " · " + t("inChapters") + " " + span;
    box.append(title, badge, stats);
    line(box, t("firstSeen"), card.first.text, card.first.ordinal, card.first.start);
    for (const d of card.described_as) line(box, t("describedAs"), d.text, d.ordinal, d.start);
    if (card.related.length) {
      const row = document.createElement("div");
      row.className = "row2";
      const strong = document.createElement("strong");
      strong.textContent = t("withLabel") + ": ";
      row.append(strong);
      const related = document.createElement("span");
      related.className = "chips";
      for (const r of card.related) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip other";
        chip.textContent = r.name + " (" + r.together + ")";
        chip.addEventListener("click", () => showCard(r.name));
        related.append(chip);
      }
      row.append(related);
      box.append(row);
    }
    if (card.last.ordinal !== card.first.ordinal) line(box, t("lastSeen"), card.last.text, card.last.ordinal, card.last.start);
    const ask = document.createElement("button");
    ask.type = "button";
    ask.textContent = t("askWho");
    ask.addEventListener("click", () => { $("question").value = t("whoIs") + card.name + "?"; run("ask"); });
    box.append(ask);
    if (!quiet) box.scrollIntoView({ block: "nearest" });
  } catch (error) {
    activeName = null;
    box.hidden = quiet;
    if (!quiet) { box.hidden = false; box.textContent = t("noCard"); }
  }
}
$("people").addEventListener("toggle", () => { if ($("people").open) refreshPeople(); });

// ---- settings ---------------------------------------------------------------------------------------------------
function keyHelp() {
  const provider = $("provider").value;
  $("keyHelp").textContent = t(provider === "gemini" ? "keyHelpGemini" : provider === "anthropic" ? "keyHelpAnthropic" : "keyHelpCustom");
  $("baseUrl").disabled = provider !== "custom";
}
$("provider").addEventListener("change", keyHelp);
$("openSettings").addEventListener("click", () => {
  const llm = state.llm || {};
  $("current").textContent = t("stored") + (llm.stored_provider ? llm.stored_provider + " " + llm.key : t("none")) + (llm.model ? " · " + llm.model : "");
  if (llm.stored_provider) $("provider").value = llm.stored_provider;
  $("apiKey").value = "";
  $("setMsg").textContent = "";
  keyHelp();
  $("settings").showModal();
});
$("closeSettings").addEventListener("click", () => $("settings").close());
$("openAi").addEventListener("click", () => $("openSettings").click());
$("openHelp").addEventListener("click", () => $("helpDialog").showModal());
$("closeHelp").addEventListener("click", () => $("helpDialog").close());
$("setForm").addEventListener("submit", (event) => event.preventDefault());
$("apiKey").addEventListener("keydown", (event) => { if (event.key === "Enter") { event.preventDefault(); $("saveKey").click(); } });
$("saveKey").addEventListener("click", async () => {
  const provider = $("provider").value;
  const apiKey = $("apiKey").value.trim();
  if (!apiKey && provider !== "custom") { $("setMsg").textContent = t("needKey"); return; }
  try {
    state = await post("/api/settings", { provider, api_key: apiKey, base_url: $("baseUrl").value.trim(), model: $("model").value.trim() });
    $("apiKey").value = "";
    $("setMsg").textContent = t("saved");
    renderLlm();
  } catch (error) { $("setMsg").textContent = t("error") + error.message; }
});
$("clearKey").addEventListener("click", async () => {
  state = await post("/api/settings/clear", {});
  $("setMsg").textContent = t("removed");
  renderLlm();
});
$("listModels").addEventListener("click", async () => {
  try {
    const { models } = await api("/api/models");
    const list = $("modelList");
    list.textContent = "";
    for (const name of models) { const option = document.createElement("option"); option.value = name; list.append(option); }
    $("setMsg").textContent = models.length + " modelos";
  } catch (error) { $("setMsg").textContent = t("error") + error.message; }
});

function markLanguage() {
  for (const button of document.querySelectorAll(".lang button")) button.setAttribute("aria-pressed", String(button.dataset.lang === LANG));
}

for (const button of document.querySelectorAll(".lang button")) {
  button.addEventListener("click", async () => {
    if (button.dataset.lang === LANG) return;
    LANG = button.dataset.lang;
    localStorage.setItem("lang", LANG);
    applyText();
    markLanguage();
    keyHelp();
    await refresh();  // redraws the library, the position box, the guide, the examples and the character list
  });
}

markLanguage();
applyText();
refresh().catch((error) => { $("noBooks").hidden = false; $("noBooks").textContent = t("error") + error.message; });
</script>
</body>
</html>
